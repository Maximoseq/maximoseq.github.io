<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maximiliano Bange — Resume</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="design-page">
    <!-- Scroll progress bar -->
    <div class="scroll-progress" aria-hidden="true"></div>

    <div class="page">
      <!-- Header -->
      <header class="header reveal">
        <div class="header-left">
          <img
            class="avatar"
            src="images/profile-image.jpg"
            alt="Portrait photo of Maximiliano Bange"
          />

          <div class="header-text">
            <h1 class="name">Maximiliano Sequoyah Bange</h1>
            <p class="sub">University of Washington</p>
          </div>
        </div>

        <nav class="switch">
          <a class="switch-btn" href="index.html">Design &amp; Product</a>
          <a class="switch-btn" href="data.html">Data &amp; Analysis</a>
          <a class="switch-btn active" href="resume.html" aria-current="page">Resume</a>
        </nav>

        <div class="header-right">
          <div class="social-links">
            <a class="pill" href="https://github.com/Maximoseq" target="_blank" rel="noreferrer">GitHub</a>
            <a class="pill" href="https://www.linkedin.com/in/mbange3/" target="_blank" rel="noreferrer">LinkedIn</a>
            <a class="pill" href="mailto:mbange@uw.edu">Email</a>
          </div>

          <div class="school-logo">
            <img src="images/ischool-logo.png" alt="University of Washington Information School logo" />
          </div>
        </div>
      </header>

      <!-- Intro -->
      <section class="card intro reveal reveal-delay-1">
        <div class="hero-blob" aria-hidden="true"></div>
        <p class="lead">Resume</p>
        <div class="actions" style="margin-top: 14px;">
          <a class="pill pill-dark" href="maximiliano-bange-resume.pdf" download>Download PDF</a>
        </div>
      </section>

      <!-- Resume preview -->
      <div class="resume-embed reveal reveal-delay-2">
        <img
          src="images/resume.png"
          alt="Maximiliano Bange Resume"
          style="width: 100%; border-radius: var(--radius); display: block;"
        />
      </div>

      <footer class="footer">
        <p class="muted">© <span id="year"></span> Maximiliano Bange</p>
      </footer>
    </div>

    <!-- Back-to-top button -->
    <button type="button" class="to-top" aria-label="Back to top" title="Back to top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5"></path>
        <path d="M5 12l7-7 7 7"></path>
      </svg>
    </button>

    <script src="script.js" defer></script>
  </body>
</html>
